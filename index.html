<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parolina">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Parolina – Password in italiano</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #6b7280;
    --accent: #0a84ff; --ok: #34c759; --line: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989f; --line: #2c2c2e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 20px 4px 4px; }
  .sub { color: var(--muted); margin: 0 4px 18px; font-size: 15px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  #pwd {
    font: 600 24px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all; text-align: center; min-height: 64px;
    display: flex; align-items: center; justify-content: center; user-select: all;
  }
  #pwd .n { color: #ff9f0a; } #pwd .s { color: #ff375f; }
  #say { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; transition: width .3s, background .3s; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 14px;
    cursor: pointer; transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.97); }
  #copy { background: var(--accent); color: #fff; }
  #copy.done { background: var(--ok); }
  #gen { background: var(--line); color: var(--text); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--muted); font-size: 13px; }
  /* interruttore stile iOS */
  .sw { position: relative; width: 51px; height: 31px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--line); border-radius: 31px; transition: .25s; }
  .sw span::before { content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: .25s; }
  .sw input:checked + span { background: var(--ok); }
  .sw input:checked + span::before { transform: translateX(20px); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .len { font-weight: 700; font-variant-numeric: tabular-nums; }
  select, input[type=text] {
    font: inherit; font-size: 17px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  input[type=text] { width: 100%; padding: 12px; }
  label.t { display: block; font-weight: 600; margin-bottom: 8px; }
  #topicInfo { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  #topicInfo.ok { color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { padding: 6px 10px; font-size: 13px; font-weight: 500; background: var(--bg); color: var(--text); border-radius: 20px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Parolina</h1>
  <p class="sub">Password casuali con parole italiane, facili da pronunciare.</p>

  <section class="card">
    <div id="pwd" aria-live="polite"></div>
    <div id="say"></div>
    <div class="meta"><span id="strengthTxt"></span><span id="lenTxt"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="btns">
      <button id="gen">↻ Nuova</button>
      <button id="copy">Copia</button>
    </div>
  </section>

  <section class="card">
    <label class="t" for="topic">Argomento (facoltativo)</label>
    <input type="text" id="topic" placeholder="es. mare, cucina, calcio, spazio…" autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <div id="topicInfo"></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card">
    <div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between">
        <span>Lunghezza minima</span><span class="len" id="lenVal">12</span>
      </div>
      <input type="range" id="len" min="12" max="40" value="12">
    </div>
    <div class="row">
      <div>Maiuscole<small>Iniziale maiuscola di ogni parola</small></div>
      <label class="sw"><input type="checkbox" id="upper" checked><span></span></label>
    </div>
    <div class="row">
      <div>Numeri<small>Due cifre</small></div>
      <label class="sw"><input type="checkbox" id="digits" checked><span></span></label>
    </div>
    <div class="row">
      <div>Carattere speciale<small>Uno tra ! ? @ # $ % &amp; * + =</small></div>
      <label class="sw"><input type="checkbox" id="special" checked><span></span></label>
    </div>
    <div class="row">
      <div>Separatore</div>
      <select id="sep">
        <option value="-" selected>trattino  -</option>
        <option value=".">punto  .</option>
        <option value="_">underscore  _</option>
        <option value="">nessuno</option>
      </select>
    </div>
  </section>

  <footer>Generata sul tuo iPhone con crittografia sicura. Nulla viene inviato in rete.</footer>
</main>

<script src="words.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z\s]/g, " ");
const toList = s => [...new Set(norm(s).split(/\s+/).filter(w => w.length >= 3 && w.length <= 10))];
const POOL_GENERALE = toList(GENERALI);
for (const k in TEMI) { TEMI[k].chiaviL = toList(TEMI[k].chiavi + " " + k); TEMI[k].paroleL = toList(TEMI[k].parole); }

// Numero casuale sicuro e senza bias in [0, n)
function rnd(n) {
  const max = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= max);
  return a[0] % n;
}
const pick = arr => arr[rnd(arr.length)];

// Trova i temi collegati al testo scritto dall'utente
function findThemes(text) {
  const tokens = norm(text).split(/\s+/).filter(t => t.length >= 3);
  if (!tokens.length) return [];
  const hit = [];
  for (const k in TEMI) {
    const t = TEMI[k];
    const match = tokens.some(tok =>
      t.chiaviL.some(c => c === tok || (tok.length >= 4 && (c.startsWith(tok) || tok.startsWith(c)))) ||
      t.paroleL.includes(tok));
    if (match) hit.push(k);
  }
  return hit;
}

function currentPool() {
  const themes = findThemes($("topic").value);
  if (!themes.length) return { pool: POOL_GENERALE, themes };
  const set = new Set();
  themes.forEach(k => TEMI[k].paroleL.forEach(w => set.add(w)));
  return { pool: [...set], themes };
}

const SAY = { "!":"punto esclamativo", "?":"punto interrogativo", "@":"chiocciola", "#":"cancelletto",
  "$":"dollaro", "%":"percento", "&":"e commerciale", "*":"asterisco", "+":"più", "=":"uguale",
  "-":"trattino", ".":"punto", "_":"trattino basso" };

let current = "";

function generate() {
  const len = +$("len").value, up = $("upper").checked, dig = $("digits").checked,
        spc = $("special").checked, sep = $("sep").value;
  const { pool, themes } = currentPool();

  const num = dig ? String(rnd(90) + 10) : "";   // 10–99: due cifre, facili da dire
  const sp = spc ? pick(SPECIALI) : "";
  const tail = num + sp;

  const words = [];
  let bits = 0;
  // Numero e simbolo attaccati all'ultima parola: "Gatto-Luna47!"
  const build = () => words.join(sep) + tail;
  // Sceglie le parole in modo da arrivare vicino alla lunghezza richiesta
  while (build().length < len || words.length < 2) {
    const used = build().length + (words.length ? sep.length : 0);
    const rem = len - used;
    let cand;
    if (words.length >= 1 && rem <= 8) {
      // ultima parola: deve chiudere la lunghezza senza sforare troppo
      const r = Math.max(rem, 3);
      cand = pool.filter(w => w.length >= r && w.length <= r + 2);
      if (cand.length < 5) cand = pool.filter(w => w.length >= r);
    } else {
      cand = pool.filter(w => w.length <= 6);
    }
    cand = cand.filter(w => !words.some(x => x.toLowerCase() === w));
    if (!cand.length) cand = pool;
    const w = pick(cand);
    bits += Math.log2(cand.length);
    words.push(up ? w[0].toUpperCase() + w.slice(1) : w);
  }
  current = build();

  // Visualizzazione con colori
  const esc = c => c.replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[m]));
  $("pwd").innerHTML = "<span>" + [...current].map(c =>
    /\d/.test(c) ? `<span class="n">${c}</span>` : SPECIALI.includes(c) ? `<span class="s">${esc(c)}</span>` : esc(c)).join("") + "</span>";

  // Come pronunciarla
  const parts = words.map(w => w.toLowerCase());
  if (num) parts.push(num);
  if (sp) parts.push(SAY[sp]);
  $("say").textContent = "Si legge: " + parts.join(" · ") + (sep ? `  (parole separate da “${SAY[sep]}”)` : "");

  // Stima della robustezza (entropia in bit)
  if (dig) bits += Math.log2(90);
  if (spc) bits += Math.log2(SPECIALI.length);
  const b = Math.round(bits);
  const [lbl, col, pct] = b < 35 ? ["Debole", "#ff3b30", 30] : b < 45 ? ["Discreta", "#ff9f0a", 55]
                        : b < 60 ? ["Buona", "#34c759", 78] : ["Ottima", "#30d158", 100];
  $("strengthTxt").textContent = `${lbl} · ~${b} bit`;
  $("lenTxt").textContent = `${current.length} caratteri`;
  $("bar").style.width = pct + "%"; $("bar").style.background = col;

  // Info argomento
  const info = $("topicInfo");
  if (!$("topic").value.trim()) { info.textContent = ""; info.className = ""; }
  else if (themes.length) { info.textContent = "Tema: " + themes.join(", "); info.className = "ok"; }
  else { info.textContent = "Argomento non riconosciuto: uso parole generiche. Prova un suggerimento qui sotto."; info.className = ""; }

  const btn = $("copy"); btn.textContent = "Copia"; btn.classList.remove("done");
}

async function copy() {
  try { await navigator.clipboard.writeText(current); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = current; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 999);
    document.execCommand("copy"); ta.remove();
  }
  const btn = $("copy"); btn.textContent = "✓ Copiata"; btn.classList.add("done");
  if (navigator.vibrate) navigator.vibrate(30);
}

// Suggerimenti argomento
for (const k in TEMI) {
  const c = document.createElement("button");
  c.textContent = k;
  c.onclick = () => { $("topic").value = k; save(); generate(); };
  $("chips").appendChild(c);
}

// Preferenze salvate
const KEYS = ["len", "upper", "digits", "special", "sep", "topic"];
function save() {
  const o = {};
  KEYS.forEach(k => o[k] = $(k).type === "checkbox" ? $(k).checked : $(k).value);
  localStorage.setItem("parolina", JSON.stringify(o));
}
try {
  const o = JSON.parse(localStorage.getItem("parolina") || "{}");
  KEYS.forEach(k => { if (k in o) $(k).type === "checkbox" ? ($(k).checked = o[k]) : ($(k).value = o[k]); });
} catch {}
$("lenVal").textContent = $("len").value;

$("len").addEventListener("input", () => { $("lenVal").textContent = $("len").value; generate(); });
["upper", "digits", "special", "sep"].forEach(k => $(k).addEventListener("change", () => { save(); generate(); }));
$("len").addEventListener("change", save);
let tmr; $("topic").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { save(); generate(); }, 300); });
$("topic").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("gen").onclick = generate;
$("copy").onclick = copy;

generate();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
